# Template only - do NOT put real keys here / do not rely on this being
# applied directly. Generate the real secret from your .env instead:
#
#   kubectl create secret generic agent-secrets --from-env-file=.env
#
# This file just documents which keys the deployment expects in
# `agent-secrets` so `kubectl apply -f k8s/secret.example.yaml` gives you a
# harmless placeholder to edit locally if you'd rather manage it declaratively.
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "not-needed"
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
