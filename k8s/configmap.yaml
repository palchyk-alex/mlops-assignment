apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  # host.minikube.internal resolves to the machine running minikube (docker
  # driver) - that's where vLLM (port 8000) and Langfuse (port 3001, via
  # docker-compose) are listening.
  VLLM_BASE_URL: "http://host.minikube.internal:8000/v1"
  VLLM_MODEL: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  LANGFUSE_HOST: "http://host.minikube.internal:3001"
